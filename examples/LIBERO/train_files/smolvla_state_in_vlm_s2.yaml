run_id: smolvla_state_in_vlm_s2
run_root_dir: results/Checkpoints
seed: 42
trackers: [jsonl, wandb]
wandb_entity: 761402180-ustb
wandb_project: starvla
is_debug: false

framework:
  name: SmolVLA
  qwenvl:
    base_vlm: ./playground/Pretrained_models/SmolVLM2-500M-Video-Instruct
    attn_implementation: flash_attention_2
    vl_hidden_dim: 2048
    num_vl_layers: 16
  train_expert_only: false
  freeze_vision_encoder: false
  action_model:
    action_dim: 7
    state_dim: 8
    s2_routing:
      use_s2_routing: true
      identity_init_scale: 1.0

    future_action_window_size: 7
    action_horizon: 8
    past_action_window_size: 0
    repeated_diffusion_steps: 8
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    num_timestep_buckets: 1000
    num_inference_timesteps: 4
    num_target_vision_tokens: 32
    add_pos_embed: true
    max_seq_len: 1024
    diffusion_model_cfg:
      cross_attention_dim: 2048
      dropout: 0.2
      final_dropout: true
      interleave_self_attention: true
      norm_type: "ada_norm"
      num_layers: 16
      output_dim: 1024
      positional_embeddings: null

datasets:
  vlm_data:
    dataset_py: vlm_datasets
    dataformat: llava_json
    dataset_use: sharegpt4v_coco
    eval_dataset: sharegpt4v_coco
    data_flatten: false
    base_interval: 2
    max_pixels: 307200
    min_pixels: 784
    model_max_length: 2048
    model_type: qwen2.5vl
    per_device_batch_size: 1

  vla_data:
    dataset_py: lerobot_datasets
    data_root_dir: playground/Datasets/LIBERO
    data_mix: libero_all
    include_state: true
    action_type: delta_qpos
    sequential_step_sampling: false
    CoT_prompt: "Your task is {instruction}. To identify the key objects for your task. Locate their bounding boxes in [x1,y1,x2,y2] format."
    CoT_answer: bbox
    default_image_resolution: [3, 224, 224]
    per_device_batch_size: 1
    load_all_data_for_training: true
    obs: ["image_0"]
    video_backend: torchvision_av

trainer:
  epochs: 100
  max_train_steps: 200000
  num_warmup_steps: 3000
  save_interval: 100000
  eval_interval: 100
  learning_rate:
    base: 5.0e-06
    qwen_vl_interface: 2.0e-06
    action_model: 5.0e-05
    state_proj: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 5.0e-07
  freeze_modules: ''
  loss_scale:
    vla: 1.0
    vlm: 0.1
  max_grad_norm: 1.0
  warmup_ratio: 0.1
  weight_decay: 0.0
  logging_frequency: 100
  gradient_clipping: 1.0
  gradient_accumulation_steps: 4

  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08

  is_resume: false
  resume_epoch: null
  resume_step: null
  enable_gradient_checkpointing: true
  enable_mixed_precision_training: true
